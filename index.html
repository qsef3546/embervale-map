<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>엠버베일 한글 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  color-scheme:dark;
  --bg:#111318; --panel:#181b22; --panel2:#20242d; --line:#2b303b; --line2:#3a4050;
  --ink:#e0e2e7; --muted:#8d93a3; --dim:#5f6575;
  --ember:#e58a3c; --shroud:#9d84d6; --ok:#5fbf7a; --ocean:#161d25;
  --display:'Nanum Myeongjo','Batang',serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
a{color:var(--shroud)}


/* 사이드바 */
.side{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.side-in{padding:18px 16px 22px;display:flex;flex-direction:column;gap:16px}
.brand{text-align:center;padding-top:4px}
.brand h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.06em;margin:0;line-height:1.1}
.brand p{margin:6px 0 0;color:var(--ember);font-size:11px;letter-spacing:.24em;text-transform:uppercase}


/* 사용법 */
.help-btn{background:var(--ember);border:0;border-radius:999px;padding:5px 13px 5px 7px;cursor:pointer;font-size:12.5px;font-weight:600;color:#1a1207;flex:none;display:flex;align-items:center;gap:6px;box-shadow:0 1px 8px rgba(229,138,60,.28)}
.help-btn:hover{filter:brightness(1.08)}
.help-btn:active{filter:brightness(.95)}
.help-btn b{display:grid;place-items:center;width:17px;height:17px;border-radius:50%;background:rgba(26,18,7,.24);font-size:11.5px;font-weight:700;line-height:1}
.help{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:22px}
.help-bg{position:absolute;inset:0;background:rgba(0,0,0,.58)}
.help-box{position:relative;background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:min(840px,100%);max-height:min(80vh,780px);display:flex;flex-direction:column;box-shadow:0 22px 60px rgba(0,0,0,.6)}
.help-hd{border-bottom:1px solid var(--line);padding:15px 20px 12px;display:flex;align-items:baseline;gap:10px;flex:none}
.help-hd h2{font-family:var(--display);font-size:20px;font-weight:800;margin:0}
.help-hd .sub{color:var(--ember);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase}
.help-hd .x{margin-left:auto;align-self:center;background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;width:28px;height:28px;border-radius:6px}
.help-hd .x:hover{background:var(--panel2);color:var(--ink)}
.help-pick{display:flex;gap:4px;padding:11px 20px 0;flex:none}
.help-pick button{background:none;border:1px solid var(--line2);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:12px;color:var(--muted)}
.help-pick button:hover{color:var(--ink)}
.help-pick button[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:#1a1207;font-weight:600}
.help-body{padding:16px 20px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:17px}
.help-shot{display:block;position:relative}
.help-img{width:100%;display:block;border-radius:8px;border:1px solid var(--line2);background:var(--bg)}
.help-nums{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.help-nums li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;font-size:13px;line-height:1.65;color:#c5c9d2}
.help-nums .n{width:22px;height:22px;border-radius:50%;background:#e23c3c;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.help-nums b{color:var(--ink);font-weight:600}
.help-sec h3{margin:0 0 7px;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ember)}
.help-sec ul{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:6px}
.help-sec li{font-size:13px;line-height:1.7;color:#c5c9d2}
.help-sec li b{color:var(--ink);font-weight:600}
.help-sec kbd{background:var(--panel2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:inherit;font-size:11.5px;color:var(--ink)}
@media (max-width:760px){
  .help{padding:12px}
  .help-btn{padding:5px 7px}
  .help-btn span{display:none}
  .help-body{padding:14px 16px 20px}
}

/* 상단바 · 푸터 */
.shell{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100%}
.topbar{display:flex;align-items:baseline;gap:18px;padding:9px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar .brand{display:flex;align-items:baseline;gap:9px;padding:0;text-align:left;flex:none}
.topbar .brand h1{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.05em;margin:0;line-height:1}
.topbar .brand p{margin:0;color:var(--ember);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.nav{display:flex;gap:3px;flex:1;min-width:0}
.nav a{padding:5px 13px;border-radius:6px;text-decoration:none;color:var(--muted);font-size:13px;white-space:nowrap}
.nav a:hover{background:var(--panel2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--ember)}
.foot{padding:11px 18px;border-top:1px solid var(--line);background:var(--panel);font-size:11.5px;line-height:1.65;color:var(--muted);text-align:center}
.foot p{margin:0 auto;max-width:960px}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:0}
body:not([data-view="map"]) .app{grid-template-columns:minmax(0,1fr)}
body:not([data-view="map"]) .side,
body:not([data-view="map"]) .side-toggle{display:none}
.sec-title{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ember);margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
.sec-title button{background:none;border:0;color:var(--dim);font-size:11px;letter-spacing:.04em;cursor:pointer;padding:2px 4px;text-transform:none}
.sec-title button:hover{color:var(--ink)}

.search{display:flex;border:1px solid var(--line2);border-radius:6px;background:var(--bg)}
.search input{flex:1;min-width:0;background:none;border:0;padding:9px 10px;outline:none}
.search:focus-within{border-color:var(--ember)}
.results{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1px;max-height:280px;overflow-y:auto}
.results button{width:100%;text-align:left;background:none;border:0;padding:6px 6px;border-radius:5px;display:flex;gap:8px;align-items:center;cursor:pointer}
.results button:hover{background:var(--panel2)}
.results .t{display:flex;flex-direction:column;min-width:0}
.results .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.results small{color:var(--dim);font-size:11px}
.empty{color:var(--dim);font-size:12px;padding:6px 8px}

.row{display:flex;gap:8px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;cursor:pointer;font-size:12.5px;flex:1}
.btn:hover{border-color:var(--muted)}

.cats{display:grid;grid-template-columns:1fr 1fr;gap:1px 6px}
.cat{display:flex;align-items:center;gap:7px;background:none;border:0;padding:5px 4px;border-radius:5px;cursor:pointer;text-align:left;min-width:0}
.cat:hover{background:var(--panel2)}
.cat .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .ct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cat[aria-pressed="false"] .nm,.cat[aria-pressed="false"] .ct{color:var(--dim)}
.cat[aria-pressed="false"] svg{opacity:.3}

.check{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}
.check input{accent-color:var(--ember)}
.note{font-size:11.5px;line-height:1.65;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* 지도 */
.main{position:relative;overflow:hidden;min-width:0}
.map{position:absolute;inset:0;background:var(--ocean);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.map.dragging{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.world canvas{display:block;width:100%;height:100%}
.layer{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
.label{position:absolute;left:0;top:0;text-align:center;white-space:nowrap;color:#f4efe3;text-shadow:0 1px 2px #000,0 0 10px rgba(0,0,0,.8);pointer-events:none}
.label b{display:block;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.14em}
.label small{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;opacity:.7;margin-top:1px}
.pin{position:absolute;left:0;top:0;width:28px;height:28px;padding:0;border:0;background:none;cursor:pointer;border-radius:50%}
.pin svg{display:block;width:28px;height:28px;transition:transform .12s;transform:scale(var(--ps,1))}
.pin.sm,.pin.sm svg{width:20px;height:20px}
.pin:hover svg,.pin.active svg{transform:scale(calc(var(--ps,1) * 1.3))}
.pin:hover,.pin.active{z-index:2}
.pin.found{opacity:.35}
.pin.found::after{content:"";position:absolute;right:-1px;top:-1px;width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--bg)}
.pin.hidefound{display:none}
.tip{position:absolute;left:0;top:0;z-index:7;pointer-events:none;background:rgba(15,17,22,.94);border:1px solid var(--line2);border-radius:6px;padding:6px 10px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.45);max-width:min(320px,calc(100% - 24px));overflow:hidden;text-overflow:ellipsis}
.tip b{display:block;font-size:13px;font-weight:600}
.tip small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.tip small i{font-style:normal;color:var(--ok)}

.ctrl{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:5}
.ctrl button{width:38px;height:38px;border-radius:7px;background:var(--panel);border:1px solid var(--line2);cursor:pointer;display:grid;place-items:center;font-size:18px;line-height:1}
.ctrl button:hover{border-color:var(--muted)}
.ctrl svg{width:18px;height:18px}
.side-toggle{display:none;position:absolute;left:14px;top:14px;z-index:5;background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:9px 12px;cursor:pointer;font-size:13px}
.coords{position:absolute;left:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--muted);background:rgba(17,19,24,.75);padding:4px 8px;border-radius:5px;font-variant-numeric:tabular-nums;pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;letter-spacing:.1em;pointer-events:none}

/* 진행 패널 (우측) */
.tracker{position:absolute;right:62px;top:14px;width:250px;max-height:calc(100% - 28px);overflow-y:auto;background:rgba(24,27,34,.96);border:1px solid var(--line2);border-radius:8px;z-index:5}
.tracker h2{margin:0;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ember);padding:12px 14px 8px;display:flex;justify-content:space-between;align-items:center}
.tracker h2 button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px}
.tracker ul{list-style:none;margin:0;padding:0 14px 12px;display:flex;flex-direction:column;gap:9px}
.tracker li{display:grid;grid-template-columns:20px 1fr auto;gap:4px 8px;align-items:center;font-size:12.5px}
.tracker li .bar{grid-column:2/4}
.tracker .num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11.5px}
.bar{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ember);width:0;transition:width .3s}
.bar.done i{background:var(--ok)}

/* 팝업 */
.pop{position:absolute;left:0;top:0;width:280px;max-width:calc(100% - 24px);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:13px 14px 14px;z-index:8;box-shadow:0 10px 30px rgba(0,0,0,.55);cursor:default;display:flex;flex-direction:column;gap:9px}
.pop .hd{display:flex;gap:10px;align-items:flex-start;padding-right:22px}
.pop .hd svg{width:28px;height:28px;flex:none}
.pop h3{margin:0;font-family:var(--display);font-size:17px;font-weight:800;line-height:1.3;text-wrap:balance}
.pop .en{font-size:11.5px;color:var(--dim);margin-top:1px}
.pop .meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.pop p{margin:0;font-size:13px;line-height:1.6;color:#c9ccd4}
.pop .x{position:absolute;right:6px;top:6px;background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;width:26px;height:26px;border-radius:5px}
.pop .x:hover{background:var(--panel)}
.pop .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}

/* 체크리스트 */
.list{position:absolute;inset:0;overflow-y:auto;padding:24px 24px 40px;background:var(--bg)}
.list-in{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.list h2{font-family:var(--display);font-size:24px;margin:0 0 2px}
.list .lead{color:var(--muted);margin:0 0 8px;font-size:13px}
.overall{display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.overall .t{display:flex;justify-content:space-between;font-size:13px}
.overall .t b{font-variant-numeric:tabular-nums}
details.grp{background:var(--panel);border:1px solid var(--line);border-radius:8px}
details.grp summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:24px 1fr 90px 64px;gap:10px;align-items:center;padding:11px 14px}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary .nm{font-weight:600}
details.grp summary .nm small{font-weight:400;color:var(--dim);margin-left:6px;font-size:11.5px}
details.grp summary .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
details.grp .items{border-top:1px solid var(--line);padding:6px 8px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1px 12px}
.item{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:5px;font-size:13px;min-width:0}
.item:hover{background:var(--panel2)}
.item input{accent-color:var(--ok);flex:none}
.item span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.done span{color:var(--dim);text-decoration:line-through}
.item .go{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:4px;flex:none}
.item .go:hover{color:var(--ink);background:var(--panel)}
.list .sec{font-size:11px;letter-spacing:.16em;color:var(--ember);text-transform:uppercase;margin:10px 0 -4px}


/* 제작 */
.craft{position:absolute;inset:0;overflow:hidden;background:var(--bg);display:grid;grid-template-columns:320px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.craft[data-todo="1"]{grid-template-columns:320px minmax(0,1fr) 330px}
.cf-list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.cf-top{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.cf-chips{display:flex;flex-wrap:wrap;gap:5px}
.cf-chip{padding:4px 9px;border:1px solid var(--line2);border-radius:999px;background:var(--panel);color:var(--muted);cursor:pointer;font-size:11.5px;white-space:nowrap}
.cf-chip:hover{color:var(--ink)}
.cf-chip[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:#1a1207;font-weight:600}
.cf-count{font-size:11.5px;color:var(--dim);padding:0 14px 6px}
.cf-scroll{flex:1;overflow-y:auto;padding:0 8px 16px}
.cf-row{width:100%;display:flex;gap:9px;align-items:center;background:none;border:0;padding:6px 7px;border-radius:6px;cursor:pointer;text-align:left;min-width:0}
.cf-row:hover{background:var(--panel2)}
.cf-row[aria-current="true"]{background:var(--panel2);box-shadow:inset 2px 0 0 var(--ember)}
.cf-ic{width:30px;height:30px;flex:none;border-radius:6px;background:#0d0f13;border:1px solid var(--line);object-fit:contain}
.cf-ic.ph{display:grid;place-items:center;color:var(--dim);font-size:13px}
.cf-nm{min-width:0;flex:1;display:flex;flex-direction:column}
.cf-nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.cf-nm small{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.cf-detail{overflow-y:auto;padding:22px 26px 48px;min-width:0}
.cf-detail .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.cf-hero{display:flex;gap:14px;align-items:flex-start}
.cf-hero .cf-ic{width:60px;height:60px;border-radius:9px}
.cf-hero h2{font-family:var(--display);font-size:24px;margin:0;line-height:1.25}
.cf-hero .en{color:var(--dim);font-size:12.5px;margin-top:2px}
.cf-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.cf-tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.cf-tag.r-Uncommon{color:#5fbf7a;border-color:#2f5c3c}
.cf-tag.r-Rare{color:#5aa6e0;border-color:#2b4a63}
.cf-tag.r-Epic{color:#a98ae0;border-color:#4a3b6b}
.cf-tag.r-Legendary{color:#e0a648;border-color:#6b5320}
.cf-tag.r-Collectible{color:#e07ab0;border-color:#6b3050}
.cf-desc{margin:0;font-size:13px;line-height:1.7;color:#c9ccd4}
.cf-block{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px 15px 15px}
.cf-block>h3{margin:0 0 9px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ember);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cf-block>h3 em{font-style:normal;color:var(--dim);letter-spacing:0;text-transform:none;font-size:11.5px}
.cf-none{color:var(--dim);font-size:12.5px;margin:0}
.cf-stats{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;margin:0;font-size:13px}
.cf-stats dt{color:var(--muted);white-space:nowrap}
.cf-stats dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums}
.cf-stats dt.ef{color:var(--ok)}
.cf-stats dd.ef{color:var(--ok)}
.cf-stats dt.dn{color:#d97070}
.cf-stats dd.dn{color:#d97070}
.cf-stats hr{grid-column:1/-1;border:0;border-top:1px solid var(--line);margin:3px 0}
.cf-perks{display:flex;flex-wrap:wrap;gap:5px}
.cf-perk{font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--shroud)}
.cf-src{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:#c2c6d0;margin:0;padding:0;list-style:none}
.cf-src li{display:flex;gap:7px}
.cf-src b{color:var(--muted);font-weight:500;flex:none;min-width:44px}

/* 레시피 트리 */
.cf-tree{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.cf-tree .cf-tree{margin-left:14px;padding-left:12px;border-left:1px solid var(--line2);margin-top:2px}
.cf-node{display:flex;align-items:center;gap:7px;padding:3px 4px;border-radius:5px;min-width:0}
.cf-node:hover{background:var(--panel2)}
.cf-tw{width:18px;height:18px;flex:none;background:none;border:0;color:var(--dim);cursor:pointer;border-radius:4px;display:grid;place-items:center;font-size:10px;line-height:1}
.cf-tw:hover{color:var(--ink);background:var(--panel)}
.cf-tw[disabled]{opacity:0;cursor:default}
.cf-node img,.cf-node .ph{width:22px;height:22px;flex:none;border-radius:4px;background:#0d0f13;border:1px solid var(--line);object-fit:contain}
.cf-node .ph{display:grid;place-items:center;color:var(--dim);font-size:10px}

<script>
(() => {
const D = window.EMB;
/* ───────── 아이콘 ───────── */
const GL = {
  spire:'M8 1 11 15H5Z', flame:'M8 1c2 4 5 5 4 10a4 4 0 0 1-8 0c0-3 2-4 2-6 1 2 2 2 2-4Z',
  sun:'M8 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8ZM7 0h2v3H7Zm0 13h2v3H7ZM0 7h3v2H0Zm13 0h3v2h-3Z', moon:'M10 1a7 7 0 1 0 5 11A6 6 0 0 1 10 1Z',
  vault:'M2 15V6l6-4 6 4v9Zm4-2h4V8H6Z', obelisk:'M6 15 7 3l1-2 1 2 1 12Z', drop:'M8 1c3 5 5 7 5 9.5a5 5 0 0 1-10 0C3 8 5 6 8 1Z',
  star:'m8 1 1.6 5H15l-4.4 3 1.7 5.5L8 11l-4.3 3.5L5.4 9 1 6h5.4Z', bale:'M3 9h10l-2 6H5ZM8 1c1.5 2.5 3 3.5 2.5 6h-5C5 4.5 6.5 3.5 8 1Z',
  hall:'M3 15V7a5 5 0 0 1 10 0v8h-3V8a2 2 0 0 0-4 0v7Z', gem:'M4 2h8l3 4-7 9-7-9Z', house:'M2 8 8 2l6 6v6h-4v-4H6v4H2Z',
  tent:'M8 2 15 14H1Zm0 6-3 6h6Z', wheat:'M7.2 15V6h1.6v9ZM8 1c2 1 2 3 0 5-2-2-2-4 0-5ZM4 4c2 0 3.5 1.5 3.5 3.5C5.5 7.5 4 6 4 4Zm8 0c0 2-1.5 3.5-3.5 3.5C8.5 5.5 10 4 12 4Z',
  pick:'M2 4c3-3 9-3 12 0-2-1-4-1.5-5.2-1.3L9 15H7L7.2 2.7C6 2.5 4 3 2 4Z', swords:'M2 2h3l8 8 1.5-1.5 1 1-2 2 1.5 1.5-1 1-1.5-1.5-2 2-1-1L11 12 3 4Z',
  door:'M2 15V3h12v12h-4V9H6v6Z', cross:'M6.5 1h3v4H13v3H9.5v7h-3V8H3V5h3.5Z',
  skull:'M8 1a6 6 0 0 0-6 6c0 2 1 3.5 2.5 4.3V15h7v-3.7C13 10.5 14 9 14 7a6 6 0 0 0-6-6Zm-2.5 5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Zm5 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Z',
  cave:'M1 15C2 7 5 3 8 3s6 4 7 12h-4c0-4-1-6-3-6s-3 2-3 6Z', book:'M2 3c2-1 4-1 5.3.5V14C6 13 4 13 2 14Zm12 0c-2-1-4-1-5.3.5V14c1.3-1 3.3-1 5.3 0Z',
  shell:'M8 2a6 6 0 1 1-6 6h3a3 3 0 1 0 3-3Z', note:'M6 2h8v9.5a2.5 2.5 0 1 1-2-2.45V5H8v7.5A2.5 2.5 0 1 1 6 10.05Z',
  statue:'M8 1a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM5 7h6l1 5H4ZM3 13h10v2H3Z', banner:'M3 1h10v14l-5-3-5 3Z',
  bone:'M3 3a2 2 0 0 1 3 1l5 5a2 2 0 1 1 1 3 2 2 0 1 1-3 1L4 8a2 2 0 1 1-1-3 2 2 0 0 1 0-2Z',
  mappiece:'M1 3l4.5-1.5 5 2L15 2v11l-4.5 1.5-5-2L1 14Z', relief:'M2 2h12v12H2Zm3 3v6h6V5Z', quest:'M7 2h2v8H7Zm0 10h2v2H7Z',
};
const GROUPS = D.groups, GI = Object.fromEntries(GROUPS.map(g => [g.id, g]));
function icon(gid, size = 28){
  const g = GI[gid];
  return `<svg viewBox="0 0 30 30" width="${size}" height="${size}" aria-hidden="true"><circle cx="15" cy="16.4" r="13.4" fill="#000" fill-opacity=".45"/><circle cx="15" cy="15" r="13" fill="#15181f" stroke="${g.color}" stroke-width="2"/><g transform="translate(7 7)"><path d="${GL[g.glyph]}" fill="${g.color}" fill-rule="evenodd"/></g></svg>`;
}

/* ───────── 데이터 ───────── */
const STR = D.str;                       // [[en, ko], ...]
const tr = i => i < 0 ? null : { en: STR[i][0], ko: STR[i][1] || STR[i][0] };
const MARKERS = D.markers.map(a => ({ id:a[0], g:a[1], x:a[2], y:a[3], name:tr(a[4]), desc:tr(a[5]), region:a[6], article:a[7] }));
const REG = D.regions;
const [X0, X1, Y0, Y1] = D.raster.bounds, WW = X1 - X0, WH = Y1 - Y0;
const toW = m => [m.x - X0, Y1 - m.y];           // 위키 좌표 → 화면 월드 좌표 (y 뒤집기)

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const found = new Set(store.get('emb2.found', []));
const hidden = new Set(store.get('emb2.hidden', GROUPS.filter(g => !g.def).map(g => g.id)));
const saveFound = () => store.set('emb2.found', [...found]);
const saveHidden = () => store.set('emb2.hidden', [...hidden]);
const byGroup = {}; MARKERS.forEach(m => (byGroup[m.g] = byGroup[m.g] || []).push(m));
const SECTIONS = [...new Set(GROUPS.map(g => g.sec))];
const $ = id => document.getElementById(id);
function el(tag, props = {}, text){ const e = document.createElement(tag); Object.assign(e, props); if (text != null) e.textContent = text; return e; }

/* ───────── 지형 ───────── */
function hash(x, y){ let h = Math.imul(x|0, 374761393) ^ Math.imul(y|0, 668265263) ^ 0x5bd1e995;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y){ const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = hash(xi,yi), b = hash(xi+1,yi), c = hash(xi,yi+1), d = hash(xi+1,yi+1); return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v; }
function fbm(x, y, o = 4){ let s = 0, a = .5, f = 1; for (let i = 0; i < o; i++){ s += a*vnoise(x*f, y*f); f *= 2; a *= .5; } return s / (1 - Math.pow(.5, o)); }

function drawTerrain(){
  const R = D.raster, N = R.n, grid = Uint8Array.from(atob(R.grid), c => c.charCodeAt(0));
  const cv = $('terrain'), CW = 1200, CH = Math.round(CW * WH / WW);
  cv.width = CW; cv.height = CH;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(CW, CH), px = img.data, reg = new Uint8Array(CW*CH), hgt = new Float32Array(CW*CH);
  const cols = R.ids.map(id => REG[id].rgb);
  for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++){
    const i = y*CW + x, nx = x / CW * 8, ny = y / CH * 8;
    const gx = (x + .5)/CW*N + (fbm(nx+3, ny+7) - .5)*9, gy = (y + .5)/CH*N + (fbm(nx+11, ny+1) - .5)*9;
    const ci = Math.max(0, Math.min(N-1, gx|0)), cj = Math.max(0, Math.min(N-1, gy|0));
    reg[i] = grid[cj*N + ci];
    hgt[i] = fbm(nx*1.6 + 20, ny*1.6 + 20, 5);
  }
  const lerp = (a, b, t) => a + (b - a)*t;
  for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++){
    const i = y*CW + x, o = i*4, r0 = reg[i]; let r, g, b;
    if (!r0){
      const n = (hash(x, y*3) - .5)*5 + (fbm(x/90, y/90) - .5)*14;
      r = 24 + n; g = 33 + n; b = 42 + n;
    } else {
      const h = hgt[i], up = i >= CW+1 ? hgt[i-CW-1] : h;
      const shade = Math.min(1, Math.max(0, .5 + (h - up)*55));
      const m = (.66 + .5*shade) * (.86 + .26*h);
      [r, g, b] = cols[r0-1].map(c => c*m);
      if (R.ids[r0-1] === 'veil' && fbm(x/40+3, y/40+5) > .66){ r = 48; g = 88; b = 98; }
      if ((R.ids[r0-1] === 'alba' || R.ids[r0-1] === 'nomad') && h > .74){ const s = (h - .74)*3; r = lerp(r, 236, s); g = lerp(g, 239, s); b = lerp(b, 243, s); }
      const e = (x+1 < CW && reg[i+1] && reg[i+1] !== r0) || (y+1 < CH && reg[i+CW] && reg[i+CW] !== r0);
      if (e){ r *= .5; g *= .5; b *= .5; }
      const shore = (x+1 < CW && !reg[i+1]) || (x > 0 && !reg[i-1]) || (y+1 < CH && !reg[i+CW]) || (y > 0 && !reg[i-CW]);
      if (shore){ r = 196; g = 182; b = 140; }
      const n = (hash(x, y) - .5)*7; r += n; g += n; b += n;
    }
    px[o] = r; px[o+1] = g; px[o+2] = b; px[o+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  // 1000 단위 격자
  ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1;
  for (let v = Math.ceil(X0/1000)*1000; v < X1; v += 1000){ const x = (v - X0)/WW*CW; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CH); ctx.stroke(); }
  for (let v = Math.ceil(Y0/1000)*1000; v < Y1; v += 1000){ const y = (Y1 - v)/WH*CH; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke(); }

/* ───────── 뷰 ───────── */
const mapEl = $('map'), world = $('world'), pinsEl = $('pins'), labelsEl = $('labels'), pop = $('pop');
world.style.width = WW + 'px'; world.style.height = WH + 'px';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let view = { s:.1, tx:0, ty:0 }, fitS = .1, laidOutS = -1;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function fitView(){
  const r = mapEl.getBoundingClientRect();
  const s = Math.min(r.width / WW, r.height / WH) * .96;
  return { s, tx:(r.width - WW*s)/2, ty:(r.height - WH*s)/2 };
}
/* 애니메이션 루프: 줌은 목표 배율을 지수 감쇠로 따라가고, 드래그 후엔 관성으로 미끄러진다.
   움직이는 동안은 마커 층 전체를 한 번에 변형하고, 멈추면 마커 위치를 새 배율로 다시 배치한다. */
let zoomTo = null, anchor = [0, 0], vel = { x:0, y:0 }, coasting = false, flying = false, raf = 0, lastT = 0;
const minS = () => fitS*.7, maxS = () => fitS*14;
function zoomNow(f, cx, cy){
  const ns = clamp(view.s*f, minS(), maxS()), q = ns/view.s;
  view.tx = cx - (cx - view.tx)*q; view.ty = cy - (cy - view.ty)*q; view.s = ns;
}
function zoomAt(f, cx, cy){
  flying = false; zoomTo = clamp((zoomTo ?? view.s)*f, minS(), maxS()); anchor = [cx, cy]; kick();
}
function kick(){ if (!raf){ lastT = performance.now(); raf = requestAnimationFrame(tick); } }
function tick(t){
  raf = 0; const dt = clamp(t - lastT, 1, 50); lastT = t; let busy = false;
  if (zoomTo != null && !flying){
    const d = Math.log(zoomTo / view.s);
    if (Math.abs(d) < .002){ zoomNow(zoomTo / view.s, ...anchor); zoomTo = null; }
    else { zoomNow(Math.exp(d * (1 - Math.exp(-dt/80))), ...anchor); busy = true; }
  }
  if (coasting && !pts.size){
    view.tx += vel.x*dt; view.ty += vel.y*dt;
    const k = Math.exp(-dt/220); vel.x *= k; vel.y *= k;
    if (Math.hypot(vel.x, vel.y) < .02) coasting = false; else busy = true;
  }
  apply();
  if (busy) kick(); else if (!flying && laidOutS !== view.s) layout();
}
function flyTo(wx, wy, s){
  const r = mapEl.getBoundingClientRect(), from = { ...view }, to = { s, tx:r.width/2 - wx*s, ty:r.height/2 - wy*s };
  zoomTo = null; coasting = false;
  if (reduce){ view = to; layout(); apply(); return; }
  flying = true; const t0 = performance.now();
  (function step(t){
    if (!flying) return;
    const p = Math.min(1, (t - t0)/520), e = 1 - Math.pow(1 - p, 3);
    view = { s:from.s + (to.s-from.s)*e, tx:from.tx + (to.tx-from.tx)*e, ty:from.ty + (to.ty-from.ty)*e };
    apply(); if (p < 1) requestAnimationFrame(step); else { flying = false; layout(); apply(); }
  })(t0);
}
let pinEls = [], labelEls = [], popM = null;
function layout(){
  laidOutS = view.s;
  pinsEl.style.setProperty('--ps', clamp(.45 + .22*(view.s/fitS), .55, 1).toFixed(3));
  for (const { m, e } of pinEls){ const [wx, wy] = toW(m), h = e.classList.contains('sm') ? 10 : 14; e.style.transform = `translate(${wx*view.s - h}px,${wy*view.s - h}px)`; }
  for (const { r, e } of labelEls){ e.style.transform = `translate(${(r.c[0]-X0)*view.s}px,${(Y1-r.c[1])*view.s}px) translate(-50%,-50%)`; }
}
function apply(){
  world.style.transform = `translate(${view.tx}px,${view.ty}px) scale(${view.s})`;
  // 배치 배율에서 너무 멀어지면(마커가 눈에 띄게 커지거나 작아지면) 중간에 한 번 재배치
  if (laidOutS < 0 || view.s/laidOutS > 1.4 || view.s/laidOutS < .7) layout();
  const t = `translate(${view.tx}px,${view.ty}px) scale(${view.s/laidOutS})`;
  pinsEl.style.transform = t; labelsEl.style.transform = t;
  placePop(); placeTip();
}

/* 담은 수는 '제작 횟수'다. 1회에 여러 개 나오는 레시피에서도
   +/− 한 번이 늘 재료 한 벌씩 움직이게 하려고 이렇게 센다. */
function loadTodo(){
  const cur = store.get('emb2.todo2', null);
  if (cur) return cur;
  const old = store.get('emb2.todo', {}), out = {};   // 예전엔 만들 개수를 담았다
  for (const [n, q] of Object.entries(old)){
    const i = CI.findIndex(x => x.n === n), r = i < 0 ? null : madeBy[i][0];
    out[n] = Math.max(1, Math.ceil(q / (r?.q || 1)));
  }
  return out;
}
const todo = new Map(Object.entries(loadTodo()));
let todoOpen = store.get('emb2.todoOpen', true);
function saveTodo(){ store.set('emb2.todo2', Object.fromEntries(todo)); }
function todoBump(name, d){
  const q = (todo.get(name) || 0) + d;
  if (q > 0) todo.set(name, q); else todo.delete(name);
  saveTodo(); renderTodo(); renderCraftDetail();
}
function todoDrop(name){ todo.delete(name); saveTodo(); renderTodo(); renderCraftDetail(); }

/* 할 일에 담긴 것들의 재료를 한데 더한다. */
function todoTotals(){
  const sum = new Map();
  for (const [name, runs] of todo){
    const i = cByName.get(name);
    if (i == null) continue;
    const r = madeBy[i][0];
    if (!r) continue;
    for (const [ii, iq] of r.i) sum.set(ii, (sum.get(ii) || 0) + iq * runs);
  }
  return [...sum].sort((a, b) => b[1] - a[1]
    || cName(CI[a[0]]).localeCompare(cName(CI[b[0]]), 'ko'));
}

  const box = $('cfTodo');

  box.hidden = !todo.size;
  $('craft').dataset.todo = todo.size ? '1' : '0';

  const totals = todoTotals();
  const hd = el('div', { className:'cf-todo-hd' });

/* 재료를 어디서 구하나. 만들 수 있으면 작업대, 아니면 지역·채집 방식. */
function cWhere(i){
  const it = CI[i], r = madeBy[i][0];
  if (r) return cShops(r)[0] || '제작';
  const bits = [];
  if (it.b?.length) bits.push(it.b.map(b => C.biomes[b]).join(', '));
  if (it.t?.length) bits.push(it.t.map(t => C.types[t]).join('/'));
  return bits.join(' · ') || '원자재';
}
function cWhereFull(i){
  const it = CI[i];
  return [...(it.w || []), ...(it.dr || []),
          it.m?.length ? '처치: ' + it.m.join(', ') : ''].filter(Boolean).join('\n');
}

/* 트리 한 줄. dir='down' 은 재료 쪽, dir='up' 은 이걸 쓰는 쪽으로 내려간다. */
function cTreeNode(idx, qty, dir, path, depth, where){
  const it = CI[idx], li = el('li'), node = el('div', { className:'cf-node' });
  const loop = path.includes(idx);
  const kids = loop || depth >= 6 ? []
    : dir === 'down' ? (madeBy[idx][0]?.i || [])
    : [...new Set(usedIn[idx].map(r => r.o))].map(o => [o, 0]);
  const key = dir + ':' + path.concat(idx).join('>');
  const open = cExpanded.has(key);

  const tw = el('button', { className:'cf-tw', ariaLabel:open ? '접기' : '펼치기' }, kids.length ? (open ? '▼' : '▶') : '');
  if (!kids.length) tw.disabled = true;
  const link = el('button', { className:'cf-link', title:it.k ? it.n : '' }, cName(it));
  link.onclick = () => selectCraft(idx);
  node.append(tw, cIcon(it, ''), link);
  if (qty) node.append(el('span', { className:'cf-qty' }, '×' + qty));
  if (where) node.append(el('span', { className:'cf-where' }, where));
  else if (dir === 'down') node.append(el('span', { className:'cf-where', title:cWhereFull(idx) }, cWhere(idx)));
  li.append(node);

  if (open && kids.length){
    const sub = el('ul', { className:'cf-tree' });
    for (const [ci, cq] of kids)
      sub.append(cTreeNode(ci, cq, dir, path.concat(idx), depth + 1,
        dir === 'up' ? (cShops(usedIn[idx].find(r => r.o === ci))[0] || '') : ''));
    li.append(sub);
  }
  tw.onclick = () => { open ? cExpanded.delete(key) : cExpanded.add(key); renderCraftDetail(); };
  return li;
}

  const d = el('div', { className:'cf-block' }), h = el('h3', {}, title);

  return d;
}

function renderCraftDetail(){
  const box = $('cfDetail'); box.textContent = '';
  if (cSel < 0){
    box.append(el('p', { className:'cf-empty' }, '왼쪽에서 아이템을 고르면 만드는 법과, 그 아이템으로 만들 수 있는 것을 보여 줍니다.'));
    return;
  }
  const it = CI[cSel], inr = el('div', { className:'in' });

  const back = el('button', { className:'cf-back' }, '← 목록');
  back.onclick = () => { $('craft').dataset.sel = '0'; };
  inr.append(back);

  const hero = el('div', { className:'cf-hero' }), txt = el('div', { style:'min-width:0' });
  txt.append(el('h2', {}, cName(it)));
  if (it.k) txt.append(el('div', { className:'en' }, it.n));
  const tags = el('div', { className:'cf-tags' });
  if (it.ty) tags.append(el('span', { className:'cf-tag' }, it.ty));
  tags.append(el('span', { className:'cf-tag' }, C.cats[it.c]));
  if (it.r) tags.append(el('span', { className:'cf-tag r-' + it.r }, it.r));
  if (it.l) tags.append(el('span', { className:'cf-tag' }, 'Lv ' + it.l));
  for (const t of it.t || []) tags.append(el('span', { className:'cf-tag' }, C.types[t]));
  txt.append(tags);
  hero.append(cIcon(it, 'cf-ic'), txt);
  if (madeBy[cSel].length){
    const n = todo.get(it.n) || 0;
    const rq = madeBy[cSel][0].q || 1;
    const add = el('button', { className:'cf-add' },
      n ? `할 일에 ${n * rq}개` : '+ 할 일에 추가');
    if (n) add.dataset.in = '1';
    add.onclick = () => todoBump(it.n, 1);
    hero.append(add);
  }
  inr.append(hero);
  if (it.d) inr.append(el('p', { className:'cf-desc' }, it.d));

  /* 옵션 — 스탯, 먹거나 입었을 때의 효과, 퍽 */
  if (it.st?.length || it.ef?.length || it.pk?.length){
    const b = cBlock('옵션'), dl = el('dl', { className:'cf-stats' });
    for (const [k, v] of it.st || []) dl.append(el('dt', {}, k), el('dd', {}, v));
    if ((it.st || []).length && (it.ef || []).length) dl.append(el('hr'));
    for (const [k, v] of it.ef || []){
      const c = v.startsWith('−') ? ' dn' : ' ef';
      dl.append(el('dt', { className:c.trim() }, k), el('dd', { className:c.trim() }, v));
    }
    b.append(dl);
    if (it.pk?.length){
      b.append(el('p', { className:'cf-alt' }, '퍽'));
      const ps = el('div', { className:'cf-perks' });
      for (const p of it.pk) ps.append(el('span', { className:'cf-perk' }, p));
      b.append(ps);
    }
    inr.append(b);
  }

  /* 어디서 얻나 — 도감이 있는 아이템만 */
  if (it.b?.length || it.w?.length || it.dr?.length || it.m?.length){
    const b = cBlock('획득'), ul = el('ul', { className:'cf-src' });
    const add = (k, v) => { const li = el('li'); li.append(el('b', {}, k), el('span', {}, v)); ul.append(li); };
    if (it.b?.length) add('지역', it.b.map(i => C.biomes[i]).join(', '));
    for (const w of it.w || []) add('세계', w);
    for (const d of it.dr || []) add('드롭', d);
    if (it.m?.length) add('처치', it.m.join(', '));
    b.append(ul); inr.append(b);
  }

  /* 만드는 법 */
  const recs = madeBy[cSel];
  const mk = cBlock('만드는 법', recs.length > 1 ? `레시피 ${recs.length}가지` : '');
  if (!recs.length) mk.append(el('p', { className:'cf-none' }, '제작할 수 없는 원자재입니다. 세계에서 직접 구해야 합니다.'));
  for (const [n, r] of recs.entries()){
    const shops = cShops(r);
    if (recs.length > 1) mk.append(el('p', { className:'cf-alt' }, `${n + 1}. ${shops.join(' · ') || '제작'}`));
    else if (shops.length) mk.append(el('p', { className:'cf-alt' }, shops.join(' · ') + (r.q > 1 ? ` · 1회 ${r.q}개` : '')));
    const ul = el('ul', { className:'cf-tree' });
    for (const [ci, cq] of r.i) ul.append(cTreeNode(ci, cq, 'down', [cSel], 1, ''));
    mk.append(ul);
  }
  inr.append(mk);

  /* ★ 이걸로 만들 수 있는 것 */
  const outs = [...new Set(usedIn[cSel].map(r => r.o))]
    .sort((a, b) => CI[a].c - CI[b].c || cName(CI[a]).localeCompare(cName(CI[b]), 'ko'));
  const use = cBlock('이걸로 만들 수 있는 것', outs.length ? `${outs.length}종` : '');
  if (!outs.length) use.append(el('p', { className:'cf-none' }, '다른 아이템의 재료로 쓰이지 않습니다.'));
  else {
    const ul = el('ul', { className:'cf-tree' });
    const cap = Math.min(outs.length, 60);
    for (const o of outs.slice(0, cap)){
      const r = usedIn[cSel].find(x => x.o === o);
      const need = r.i.find(([i]) => i === cSel)?.[1];
      ul.append(cTreeNode(o, 0, 'up', [cSel], 1,
        [need ? `${cName(CI[cSel])} ${need}개` : '', cShops(r)[0]].filter(Boolean).join(' · ')));
    }
    use.append(ul);
    if (outs.length > cap) use.append(el('p', { className:'cf-none' }, `외 ${outs.length - cap}종`));
  }
  inr.append(use);
  box.append(inr);
  box.scrollTop = 0;
}

  pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  mapRect = mapEl.getBoundingClientRect();
  if (pts.size === 1){ moved = 0; coasting = false; vel = { x:0, y:0 }; lastMove = e.timeStamp; }
  if (pts.size === 2){ const [a, b] = [...pts.values()]; pinch = Math.hypot(a.x-b.x, a.y-b.y); zoomTo = null; }
  mapEl.classList.add('dragging'); hideTip();
});
mapEl.addEventListener('pointermove', e => {
  const r = mapRect || mapEl.getBoundingClientRect(), wx = (e.clientX - r.left - view.tx)/view.s + X0, wy = Y1 - (e.clientY - r.top - view.ty)/view.s;
  $('coords').textContent = `X ${Math.round(wx)} · Y ${Math.round(wy)}`;
  if (!pts.has(e.pointerId)) return;
  const p = pts.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (pts.size === 1){
    flying = false; view.tx += dx; view.ty += dy; moved += Math.abs(dx) + Math.abs(dy);
    const dt = Math.max(8, e.timeStamp - lastMove); lastMove = e.timeStamp;
    vel.x = vel.x*.5 + (dx/dt)*.5; vel.y = vel.y*.5 + (dy/dt)*.5;   // px/ms, 관성용
    const sp = Math.hypot(vel.x, vel.y); if (sp > 1.6){ vel.x *= 1.6/sp; vel.y *= 1.6/sp; }
    kick();
  } else if (pts.size === 2){
    const [a, b] = [...pts.values()], d = Math.hypot(a.x-b.x, a.y-b.y);
    if (pinch){ zoomNow(d / pinch, (a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top); kick(); }
    pinch = d; moved += 99;
  }
});
function up(e){
  if (!pts.has(e.pointerId)) return;
  const wasPinch = pts.size > 1;
  pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
  if (!pts.size){
    mapEl.classList.remove('dragging'); mapRect = null;
    if (moved < 6){ if (downPin && downPin._m){ hideTip(); openMarker(downPin._m); } else closePop(); }
    else if (!wasPinch && e.timeStamp - lastMove < 60 && Math.hypot(vel.x, vel.y) > .15 && !reduce){ coasting = true; }
    downPin = null;
    kick();
  }
}
mapEl.addEventListener('pointerup', up); mapEl.addEventListener('pointercancel', up);
mapEl.addEventListener('wheel', e => {
  if (e.target.closest('.pop,.tracker')) return;
  e.preventDefault(); const r = mapEl.getBoundingClientRect();
  const dy = clamp(e.deltaMode === 1 ? e.deltaY*33 : e.deltaY, -240, 240);   // 줄 단위 스크롤 보정, 과도한 점프 방지
  zoomAt(Math.exp(-dy*.0022), e.clientX - r.left, e.clientY - r.top);
}, { passive:false });
const center = () => { const r = mapEl.getBoundingClientRect(); return [r.width/2, r.height/2]; };
$('zin').onclick = () => zoomAt(1.5, ...center());
$('zout').onclick = () => zoomAt(1/1.5, ...center());
$('zfit').onclick = () => { const f = fitView(); flyTo(WW/2, WH/2, f.s); };
let booted = false;
new ResizeObserver(() => { if (!mapEl.clientWidth) return; if (!booted){ booted = true; view = fitView(); fitS = view.s; } laidOutS = -1; apply(); }).observe(mapEl);

/* ───────── 시작 ───────── */
renderLabels(); renderSide(); renderPins(); route();
requestAnimationFrame(() => setTimeout(drawTerrain, 20));
})();
</script>
</body>
</html>
