<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>엠버베일 한글 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#111318; --panel:#181b22; --panel2:#20242d; --line:#2b303b; --line2:#3a4050;
  --ink:#e0e2e7; --muted:#8d93a3; --dim:#5f6575;
  --ember:#e58a3c; --shroud:#9d84d6; --ocean:#141d26;
  --display:'Nanum Myeongjo','Batang',serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

.app{display:grid;grid-template-columns:304px 1fr;height:100%}

/* ── 사이드바 ── */
.side{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:20px 16px 24px;display:flex;flex-direction:column;gap:18px}
.brand h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.04em;margin:0;line-height:1.15;text-wrap:balance}
.brand h1 span{color:var(--ember)}
.brand p{margin:6px 0 0;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.sec-title{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec-title b{font-weight:500;color:var(--dim);letter-spacing:.04em;text-transform:none}

.search{display:flex;border:1px solid var(--line2);border-radius:6px;background:var(--bg)}
.search input{flex:1;min-width:0;background:none;border:0;padding:9px 10px;outline:none}
.search:focus-within{border-color:var(--ember)}
.results{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.results button{width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:5px;display:flex;gap:8px;align-items:center;cursor:pointer}
.results button:hover{background:var(--panel2)}
.results small{color:var(--muted);margin-left:auto;font-size:11px}
.empty{color:var(--dim);font-size:12px;padding:6px 8px}

.row{display:flex;gap:8px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;cursor:pointer;font-size:12.5px;flex:1}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#1b1208;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}

.progress{display:grid;gap:6px}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ember);width:0;transition:width .3s}
.progress .nums{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.cats{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px}
.cat{display:flex;align-items:center;gap:7px;background:none;border:0;padding:6px 4px;border-radius:5px;cursor:pointer;text-align:left;min-width:0}
.cat:hover{background:var(--panel2)}
.cat .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .ct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cat[aria-pressed="false"] .nm,.cat[aria-pressed="false"] .ct{color:var(--dim);text-decoration:line-through}
.cat[aria-pressed="false"] svg{opacity:.35}
.cat.zero .ct{color:var(--dim)}

.regions{display:flex;flex-direction:column;gap:2px}
.regions button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:5px;padding:7px 6px;cursor:pointer;text-align:left}
.regions button:hover{background:var(--panel2)}
.regions .sw{width:12px;height:12px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.regions .en{margin-left:auto;font-size:11px;color:var(--dim)}

.check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);cursor:pointer}
.check input{accent-color:var(--ember)}

.note{font-size:11.5px;line-height:1.6;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:auto}
.note a{color:var(--shroud)}

/* ── 지도 ── */
.map{position:relative;overflow:hidden;background:var(--ocean);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.map.dragging{cursor:grabbing}
.map.adding{cursor:crosshair}
.world{position:absolute;left:0;top:0;width:1000px;height:1000px;transform-origin:0 0}
.world canvas{width:1000px;height:1000px;display:block}
.layer{position:absolute;inset:0;pointer-events:none}
.label{position:absolute;left:0;top:0;text-align:center;white-space:nowrap;color:#f4efe3;text-shadow:0 1px 2px #000,0 0 10px rgba(0,0,0,.7)}
.label b{display:block;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.12em}
.label small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.75;margin-top:1px}
.pin{position:absolute;left:0;top:0;width:30px;height:30px;padding:0;border:0;background:none;pointer-events:auto;cursor:pointer;border-radius:50%}
.pin svg{display:block;width:30px;height:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));transition:transform .12s}
.pin:hover svg,.pin.active svg{transform:scale(1.18)}
.pin.found{opacity:.42}
.pin.found::after{content:"";position:absolute;right:-1px;top:-1px;width:11px;height:11px;border-radius:50%;background:#5fbf7a;box-shadow:0 0 0 2px var(--bg)}

.ctrl{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:5}
.ctrl button{width:38px;height:38px;border-radius:7px;background:var(--panel);border:1px solid var(--line2);cursor:pointer;display:grid;place-items:center;font-size:18px;line-height:1}
.ctrl button:hover{border-color:var(--muted)}
.ctrl button[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:#1b1208}
.ctrl svg{width:18px;height:18px}

.side-toggle{display:none;position:absolute;left:14px;top:14px;z-index:5;background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:9px 12px;cursor:pointer;font-size:13px}

.hint{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--ember);color:var(--ink);padding:9px 14px;border-radius:20px;font-size:12.5px;z-index:6;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;letter-spacing:.1em;pointer-events:none}

.pop{position:absolute;left:0;top:0;width:260px;max-width:calc(100vw - 32px);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:13px 14px 14px;z-index:8;box-shadow:0 10px 30px rgba(0,0,0,.5);cursor:default;display:flex;flex-direction:column;gap:9px}
.pop .hd{display:flex;gap:9px;align-items:flex-start}
.pop .hd svg{width:26px;height:26px;flex:none}
.pop h3{margin:0;font-family:var(--display);font-size:17px;font-weight:800;line-height:1.25;text-wrap:balance}
.pop .meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.pop p{margin:0;font-size:13px;line-height:1.6;color:#c9ccd4}
.pop .tag{align-self:flex-start;font-size:10.5px;letter-spacing:.06em;color:var(--shroud);border:1px solid rgba(157,132,214,.45);padding:2px 7px;border-radius:10px}
.pop .x{position:absolute;right:6px;top:6px;background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;width:26px;height:26px;border-radius:5px}
.pop .x:hover{background:var(--panel)}
.pop label.f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
.pop input[type=text],.pop select,.pop textarea{background:var(--bg);border:1px solid var(--line2);border-radius:5px;padding:7px 8px;color:var(--ink);font-size:13px;resize:vertical}
.pop .danger{background:none;border:1px solid #7a3b3b;color:#e59090}
.pop .danger.arm{background:#7a3b3b;color:#fff}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(320px,86vw);z-index:20;transform:translateX(-102%);transition:transform .22s ease;box-shadow:8px 0 30px rgba(0,0,0,.5);padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .side-toggle{display:block}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="지도 메뉴">
    <div class="brand">
      <h1>엠버베일 <span>지도</span></h1>
      <p>Enshrouded · 한글 인터랙티브 맵</p>
    </div>

    <div>
      <div class="search"><input id="q" type="search" placeholder="장소 이름 검색…" aria-label="장소 검색" autocomplete="off"></div>
      <ul class="results" id="results" hidden></ul>
    </div>

    <div class="progress">
      <div class="sec-title">탐험 진행도 <b id="progTxt"></b></div>
      <div class="bar"><i id="progBar"></i></div>
    </div>

    <div>
      <div class="sec-title">장소 <b>눌러서 표시/숨김</b></div>
      <div class="row" style="margin-bottom:8px">
        <button class="btn" id="showAll">모두 표시</button>
        <button class="btn" id="hideAll">모두 숨김</button>
      </div>
      <div class="cats" id="cats"></div>
    </div>

    <button class="btn primary" id="addSide">＋ 내 마커 추가</button>

    <div>
      <div class="sec-title">지역</div>
      <div class="regions" id="regions"></div>
    </div>

    <label class="check"><input type="checkbox" id="labelsOn" checked> 지역 이름 표시</label>

    <div class="note">
      비공식 팬 제작 개략도입니다. 지형은 새로 그렸고 지역 배치와 기본 마커 위치는 대략적입니다.
      찾은 장소와 직접 추가한 마커는 이 브라우저에만 저장됩니다.
      정확한 좌표는 <a href="https://enshrouded.wiki.gg/wiki/Map" target="_blank" rel="noopener">공식 위키 지도</a>를 참고하세요.
    </div>
  </aside>

  <main class="map" id="map" aria-label="엠버베일 지도">
    <div class="world" id="world"><canvas id="terrain" width="560" height="560"></canvas></div>
    <div class="layer" id="labels"></div>
    <div class="layer" id="pins"></div>
    <div class="loading" id="loading">지형을 그리는 중…</div>

    <button class="side-toggle" id="sideToggle" aria-controls="side" aria-expanded="false">☰ 목록</button>

    <div class="ctrl">
      <button id="zin" aria-label="확대">＋</button>
      <button id="zout" aria-label="축소">－</button>
      <button id="zfit" aria-label="전체 보기"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
      <button id="addBtn" aria-label="내 마커 추가" aria-pressed="false"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a5 5 0 0 0-5 5c0 3.6 5 9 5 9s5-5.4 5-9a5 5 0 0 0-5-5Zm0 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/></svg></button>
    </div>
    <div class="hint" id="hint" hidden>지도를 눌러 마커를 놓으세요 · Esc로 취소</div>
    <div class="pop" id="pop" hidden></div>
  </main>
</div>

<script>
(() => {
/* ───────── 데이터 ───────── */
const REGIONS = [
  { id:'spring', name:'봄의 땅',      en:'Springlands',      x:300, y:690, rgb:[112,146,78]  },
  { id:'revel',  name:'레블우드',     en:'Revelwood',        x:285, y:350, rgb:[60,104,68]   },
  { id:'nomad',  name:'유목민 고원',  en:'Nomad Highlands',  x:545, y:470, rgb:[146,146,96]  },
  { id:'kindle', name:'킨들웨이스트', en:'Kindlewastes',     x:755, y:675, rgb:[198,156,92]  },
  { id:'alba',   name:'알바네브 산맥', en:'Albaneve Summits', x:720, y:265, rgb:[206,213,222] },
  { id:'veil',   name:'베일워터 분지', en:'Veilwater Basin',  x:505, y:805, rgb:[78,134,128]  },
];
const G = { // 16×16 글리프
  spire:'M8 1 11 15H5Z', hall:'M3 15V7a5 5 0 0 1 10 0v8h-3V8a2 2 0 0 0-4 0v7Z',
  start:'M8 1c2 4 5 5 4 10a4 4 0 0 1-8 0c0-3 2-4 2-6 1 2 2 2 2-4Z', town:'M2 8 8 2l6 6v6h-4v-4H6v4H2Z',
  shrine:'M8 1.5 12.5 8 8 14.5 3.5 8Z', well:'M8 1c3 5 5 7 5 9.5a5 5 0 0 1-10 0C3 8 5 6 8 1Z',
  root:'m8 1 1.6 5H15l-4.4 3 1.7 5.5L8 11l-4.3 3.5L5.4 9 1 6h5.4Z', dungeon:'M2 15V3h12v12h-4V9H6v6Z',
  cave:'M1 15C2 7 5 3 8 3s6 4 7 12h-4c0-4-1-6-3-6s-3 2-3 6Z', tomb:'M6.5 1h3v4H13v3H9.5v7h-3V8H3V5h3.5Z',
  boss:'M1 13 2 4l3.5 4L8 2l2.5 6L14 4l1 9Z', chest:'M2 6h12v8H2Zm0-3h12v2H2Z', note:'M8 3a5 5 0 1 1 0 10A5 5 0 0 1 8 3Z',
};
const CATS = [
  { id:'spire',  name:'고대 첨탑',     c:'#7cc4e4', d:'올라가서 정화하면 빠른 이동 지점이 열립니다. 꼭대기에서 글라이더로 내려갈 수 있어요.' },
  { id:'hall',   name:'할로우 홀',     c:'#c58be0', d:'여러 층으로 된 대형 던전입니다. 파티 플레이를 권장합니다.' },
  { id:'start',  name:'시작 지점',     c:'#f0a04b' },
  { id:'town',   name:'마을·거점',     c:'#e8d27a' },
  { id:'shrine', name:'화염 성소',     c:'#ef7a45' },
  { id:'well',   name:'엘릭서 우물',   c:'#6fd0b8' },
  { id:'root',   name:'슈라우드 뿌리', c:'#a98ce8' },
  { id:'dungeon',name:'던전',          c:'#d06a6a' },
  { id:'cave',   name:'동굴',          c:'#a9a592' },
  { id:'tomb',   name:'숨겨진 무덤',   c:'#bba77c' },
  { id:'boss',   name:'보스',          c:'#e25555' },
  { id:'chest',  name:'상자·보물',     c:'#d9b35a' },
  { id:'note',   name:'메모',          c:'#cfd3dc' },
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const RG = Object.fromEntries(REGIONS.map(r => [r.id, r]));

const BUILTIN = [
  { id:'b-start', cat:'start', region:'spring', x:240, y:765, name:'잿불 금고 (Cinder Vault)', desc:'게임을 시작하는 지하 금고입니다. 밖으로 나오면 봄의 땅이 펼쳐집니다.' },
  { id:'b-town',  cat:'town',  region:'revel',  x:318, y:318, name:'브레일린 (Braelyn)', desc:'레블우드의 옛 도시입니다. 메인 퀘스트 진행 중에 들르게 됩니다.' },
  { id:'s-spring',cat:'spire', region:'spring', x:335, y:690, name:'봄의 땅 고대 첨탑' },
  { id:'s-revel', cat:'spire', region:'revel',  x:245, y:395, name:'레블우드 고대 첨탑' },
  { id:'s-nomad', cat:'spire', region:'nomad',  x:565, y:435, name:'유목민 고원 고대 첨탑' },
  { id:'s-kindle',cat:'spire', region:'kindle', x:770, y:640, name:'킨들웨이스트 고대 첨탑' },
  { id:'s-alba',  cat:'spire', region:'alba',   x:700, y:245, name:'알바네브 산맥 고대 첨탑' },
  { id:'s-veil',  cat:'spire', region:'veil',   x:525, y:805, name:'베일워터 분지 고대 첨탑' },
  { id:'h-spring',cat:'hall',  region:'spring', x:385, y:765, name:'할로우 홀 · 봄의 땅' },
  { id:'h-revel', cat:'hall',  region:'revel',  x:345, y:285, name:'할로우 홀 · 레블우드' },
  { id:'h-nomad', cat:'hall',  region:'nomad',  x:480, y:525, name:'할로우 홀 · 유목민 고원' },
  { id:'h-kindle',cat:'hall',  region:'kindle', x:715, y:740, name:'할로우 홀 · 킨들웨이스트' },
  { id:'h-alba',  cat:'hall',  region:'alba',   x:790, y:325, name:'할로우 홀 · 알바네브 산맥' },
].map(m => ({ ...m, approx:true }));

/* ───────── 저장 ───────── */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const found  = new Set(store.get('emb.found', []));
const hidden = new Set(store.get('emb.hidden', []));
let custom   = store.get('emb.custom', []);
const saveFound  = () => store.set('emb.found', [...found]);
const saveHidden = () => store.set('emb.hidden', [...hidden]);
const saveCustom = () => store.set('emb.custom', custom);
const allMarkers = () => BUILTIN.concat(custom);

/* ───────── 아이콘 ───────── */
function icon(catId, size=30){
  const c = CAT[catId] || CAT.note;
  return `<svg viewBox="0 0 30 30" width="${size}" height="${size}" aria-hidden="true">
    <circle cx="15" cy="15" r="13" fill="#161920" stroke="${c.c}" stroke-width="2"/>
    <g transform="translate(7 7)"><path d="${G[catId] || G.note}" fill="${c.c}" fill-rule="evenodd"/></g></svg>`;
}

/* ───────── 지형 생성 ───────── */
function hash(x, y){ let h = Math.imul(x|0, 374761393) ^ Math.imul(y|0, 668265263) ^ 0x5bd1e995;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y){ const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = hash(xi,yi), b = hash(xi+1,yi), c = hash(xi,yi+1), d = hash(xi+1,yi+1);
  return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v; }
function fbm(x, y, o=4){ let s = 0, a = .5, f = 1; for (let i = 0; i < o; i++){ s += a*vnoise(x*f, y*f); f *= 2; a *= .5; } return s / (1 - Math.pow(.5, o)); }

function drawTerrain(){
  const cv = document.getElementById('terrain'), N = cv.width, k = 1000 / N;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(N, N), px = img.data;
  const land = new Uint8Array(N*N), reg = new Uint8Array(N*N), hgt = new Float32Array(N*N), coastD = new Float32Array(N*N);
  const alba = RG.alba;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    const i = y*N + x, wx = x*k, wy = y*k, nx = wx/1000, ny = wy/1000;
    const dx = (nx - .5)/.46, dy = (ny - .52)/.44;
    const dd = Math.hypot(dx, dy) + (fbm(nx*4, ny*4) - .5)*.5;
    coastD[i] = dd;
    if (dd >= .95) continue;
    land[i] = 1;
    const qx = wx + (fbm(nx*3+7, ny*3+1) - .5)*260, qy = wy + (fbm(nx*3+2, ny*3+9) - .5)*260;
    let best = 0, bd = 1e12;
    for (let r = 0; r < REGIONS.length; r++){ const R = REGIONS[r], e = (qx-R.x)**2 + (qy-R.y)**2; if (e < bd){ bd = e; best = r; } }
    reg[i] = best;
    let h = fbm(nx*5+11, ny*5+3, 5);
    h += Math.max(0, 1 - Math.hypot(wx-alba.x, wy-alba.y)/260) * .55;
    hgt[i] = h;
  }
  const lerp = (a, b, t) => a + (b - a)*t;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    const i = y*N + x, o = i*4; let r, g, b;
    if (!land[i]){
      const t = Math.min(1, Math.max(0, (coastD[i] - .95)*4)), n = (hash(x*3, y*7) - .5)*6;
      r = lerp(46, 17, t) + n; g = lerp(74, 26, t) + n; b = lerp(90, 35, t) + n;
    } else {
      const R = REGIONS[reg[i]], h = hgt[i];
      const up = i >= N+1 ? hgt[i-N-1] : h;
      const shade = Math.min(1, Math.max(0, .5 + (h - up)*60));
      const m = (.62 + .55*shade) * (.88 + .24*h);
      [r, g, b] = R.rgb.map(c => c*m);
      if (R.id === 'veil' && fbm(x*k/1000*10+3, y*k/1000*10+5) > .64){ r = 50; g = 92; b = 102; }
      if (R.id === 'nomad' || R.id === 'alba'){ const s = Math.max(0, h - .78)*3; r = lerp(r, 235, s); g = lerp(g, 238, s); b = lerp(b, 242, s); }
      const edge = (x+1 < N && land[i+1] && reg[i+1] !== reg[i]) || (y+1 < N && land[i+N] && reg[i+N] !== reg[i]);
      if (edge){ r *= .55; g *= .55; b *= .55; }
      const shore = (x+1 < N && !land[i+1]) || (x > 0 && !land[i-1]) || (y+1 < N && !land[i+N]) || (y > 0 && !land[i-N]);
      if (shore){ r = 214; g = 198; b = 152; }
      const n = (hash(x, y) - .5)*8; r += n; g += n; b += n;
    }
    px[o] = r; px[o+1] = g; px[o+2] = b; px[o+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  document.getElementById('loading').hidden = true;
}

/* ───────── 뷰 (이동/확대) ───────── */
const mapEl = document.getElementById('map'), world = document.getElementById('world');
const pinsEl = document.getElementById('pins'), labelsEl = document.getElementById('labels');
const pop = document.getElementById('pop');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let view = { s:1, tx:0, ty:0 }, fitS = 1;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function fit(){
  const r = mapEl.getBoundingClientRect();
  fitS = Math.min(r.width, r.height) / 1000 * .96;
  view = { s:fitS, tx:(r.width - 1000*fitS)/2, ty:(r.height - 1000*fitS)/2 };
}
function toScreen(x, y){ return [view.tx + x*view.s, view.ty + y*view.s]; }
function toWorld(sx, sy){ return [(sx - view.tx)/view.s, (sy - view.ty)/view.s]; }
function zoomAt(f, cx, cy){
  const ns = clamp(view.s*f, fitS*.6, fitS*8), q = ns/view.s;
  view.tx = cx - (cx - view.tx)*q; view.ty = cy - (cy - view.ty)*q; view.s = ns; apply();
}
function flyTo(x, y, s){
  const r = mapEl.getBoundingClientRect(), from = { ...view };
  const to = { s, tx:r.width/2 - x*s, ty:r.height/2 - y*s };
  if (reduce){ view = to; apply(); return; }
  const t0 = performance.now();
  (function step(t){ const p = Math.min(1, (t - t0)/420), e = 1 - Math.pow(1 - p, 3);
    view = { s:from.s + (to.s-from.s)*e, tx:from.tx + (to.tx-from.tx)*e, ty:from.ty + (to.ty-from.ty)*e };
    apply(); if (p < 1) requestAnimationFrame(step); })(t0);
}

let pinEls = new Map(), labelEls = [], popAnchor = null;
function apply(){
  world.style.transform = `translate(${view.tx}px,${view.ty}px) scale(${view.s})`;
  for (const [m, el] of pinEls){ const [sx, sy] = toScreen(m.x, m.y); el.style.transform = `translate(${sx-15}px,${sy-15}px)`; }
  for (const { r, el } of labelEls){ const [sx, sy] = toScreen(r.x, r.y - 38); el.style.transform = `translate(${sx}px,${sy}px) translate(-50%,-50%)`; }
  placePop();
}

/* ───────── 핀 ───────── */
const qEl = document.getElementById('q');
function renderPins(){
  pinsEl.textContent = ''; pinEls = new Map();
  for (const m of allMarkers()){
    if (hidden.has(m.cat)) continue;
    const b = document.createElement('button');
    b.className = 'pin' + (found.has(m.id) ? ' found' : '') + (popAnchor && popAnchor.id === m.id ? ' active' : '');
    b.innerHTML = icon(m.cat);
    b.setAttribute('aria-label', `${m.name} (${CAT[m.cat].name})`);
    b.addEventListener('click', e => { e.stopPropagation(); openMarker(m); });
    pinsEl.appendChild(b); pinEls.set(m, b);
  }
  apply();
}
function renderLabels(){
  labelsEl.textContent = ''; labelEls = [];
  for (const r of REGIONS){
    const el = document.createElement('div'); el.className = 'label';
    el.innerHTML = `<b></b><small></small>`; el.querySelector('b').textContent = r.name; el.querySelector('small').textContent = r.en;
    labelsEl.appendChild(el); labelEls.push({ r, el });
  }
}

/* ───────── 팝업 ───────── */
function placePop(){
  if (pop.hidden || !popAnchor) return;
  const [sx, sy] = toScreen(popAnchor.x, popAnchor.y);
  const W = mapEl.clientWidth, pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = clamp(sx - pw/2, 8, W - pw - 8), top = sy - ph - 24;
  if (top < 8) top = sy + 24;
  pop.style.transform = `translate(${left}px,${top}px)`;
}
function closePop(){ pop.hidden = true; popAnchor = null; pinEls.forEach(el => el.classList.remove('active')); }
function el(tag, props = {}, text){ const e = document.createElement(tag); Object.assign(e, props); if (text != null) e.textContent = text; return e; }

function openMarker(m){
  popAnchor = m; pop.textContent = '';
  const cat = CAT[m.cat], rg = RG[m.region];
  const hd = el('div', { className:'hd' }); hd.innerHTML = icon(m.cat, 26);
  const t = el('div'); t.append(el('h3', {}, m.name), el('div', { className:'meta' }, cat.name + (rg ? ' · ' + rg.name : '')));
  hd.append(t); pop.append(hd);
  const x = el('button', { className:'x', ariaLabel:'닫기' }, '✕'); x.onclick = closePop; pop.append(x);
  const desc = m.desc || cat.d; if (desc) pop.append(el('p', {}, desc));
  if (m.memo) pop.append(el('p', {}, m.memo));
  if (m.approx) pop.append(el('span', { className:'tag' }, '대략적인 위치'));
  const lab = el('label', { className:'check' });
  const cb = el('input', { type:'checkbox', id:'found-' + m.id, checked:found.has(m.id) });
  cb.onchange = () => { cb.checked ? found.add(m.id) : found.delete(m.id); saveFound(); renderPins(); renderSide(); };
  lab.append(cb, document.createTextNode(' 찾음으로 표시')); pop.append(lab);
  if (m.custom){
    const del = el('button', { className:'btn danger' }, '마커 삭제');
    del.onclick = () => {
      if (!del.classList.contains('arm')){ del.classList.add('arm'); del.textContent = '한 번 더 누르면 삭제'; return; }
      custom = custom.filter(c => c.id !== m.id); found.delete(m.id); saveCustom(); saveFound(); closePop(); renderPins(); renderSide();
    };
    pop.append(del);
  }
  pop.hidden = false; renderPinsActive(); placePop();
}
function renderPinsActive(){ for (const [m, e] of pinEls) e.classList.toggle('active', !!popAnchor && popAnchor.id === m.id); }

function openAddForm(x, y){
  popAnchor = { id:'__new', x, y }; pop.textContent = '';
  pop.append(el('h3', {}, '새 마커'));
  const x0 = el('button', { className:'x', ariaLabel:'닫기' }, '✕'); x0.onclick = closePop; pop.append(x0);
  const nearest = REGIONS.reduce((a, r) => Math.hypot(r.x-x, r.y-y) < Math.hypot(a.x-x, a.y-y) ? r : a);
  pop.append(el('div', { className:'meta' }, `${nearest.name} 부근 · 좌표 ${Math.round(x)}, ${Math.round(y)}`));
  const f1 = el('label', { className:'f' }, '이름'); const nm = el('input', { type:'text', id:'f-name', placeholder:'예: 구리 광맥', maxLength:40 }); f1.append(nm);
  const f2 = el('label', { className:'f' }, '종류'); const sel = el('select', { id:'f-cat' });
  CATS.forEach(c => sel.append(el('option', { value:c.id, selected:c.id === 'note' }, c.name))); f2.append(sel);
  const f3 = el('label', { className:'f' }, '메모 (선택)'); const memo = el('textarea', { id:'f-memo', rows:2, maxLength:200 }); f3.append(memo);
  const row = el('div', { className:'row' });
  const ok = el('button', { className:'btn primary' }, '저장'), no = el('button', { className:'btn' }, '취소');
  ok.onclick = () => {
    const name = nm.value.trim() || CAT[sel.value].name;
    const m = { id:'c' + Date.now().toString(36), custom:true, cat:sel.value, region:nearest.id, x, y, name, memo:memo.value.trim() };
    custom.push(m); saveCustom(); hidden.delete(m.cat); saveHidden(); setAdd(false); renderPins(); renderSide(); openMarker(m);
  };
  no.onclick = closePop;
  row.append(no, ok); pop.append(f1, f2, f3, row);
  pop.hidden = false; placePop(); nm.focus();
}

/* ───────── 사이드바 ───────── */
function renderSide(){
  const all = allMarkers(), vis = all.filter(m => !hidden.has(m.cat));
  const f = vis.filter(m => found.has(m.id)).length;
  document.getElementById('progTxt').textContent = `${f} / ${vis.length}`;
  document.getElementById('progBar').style.width = vis.length ? (f / vis.length * 100) + '%' : '0';
  const cats = document.getElementById('cats'); cats.textContent = '';
  for (const c of CATS){
    const list = all.filter(m => m.cat === c.id), fc = list.filter(m => found.has(m.id)).length;
    const b = el('button', { className:'cat' + (list.length ? '' : ' zero') });
    b.setAttribute('aria-pressed', String(!hidden.has(c.id)));
    b.title = list.length ? '' : '아직 없음 · 직접 추가할 수 있어요';
    b.innerHTML = icon(c.id, 22);
    b.append(el('span', { className:'nm' }, c.name), el('span', { className:'ct' }, list.length ? `${fc}/${list.length}` : '–'));
    b.onclick = () => { hidden.has(c.id) ? hidden.delete(c.id) : hidden.add(c.id); saveHidden(); if (popAnchor && popAnchor.cat === c.id) closePop(); renderPins(); renderSide(); };
    cats.append(b);
  }
  runSearch();
}
function renderRegions(){
  const box = document.getElementById('regions');
  for (const r of REGIONS){
    const b = el('button');
    const sw = el('span', { className:'sw' }); sw.style.background = `rgb(${r.rgb})`;
    b.append(sw, el('span', {}, r.name), el('span', { className:'en' }, r.en));
    b.onclick = () => { flyTo(r.x, r.y, fitS*2.4); closeSide(); };
    box.append(b);
  }
}
function runSearch(){
  const q = qEl.value.trim().toLowerCase(), ul = document.getElementById('results');
  ul.textContent = ''; ul.hidden = !q; if (!q) return;
  const hits = allMarkers().filter(m => (m.name + ' ' + CAT[m.cat].name + ' ' + (RG[m.region]?.name || '')).toLowerCase().includes(q)).slice(0, 8);
  if (!hits.length){ ul.append(el('li', { className:'empty' }, '일치하는 장소가 없어요')); return; }
  for (const m of hits){
    const li = el('li'), b = el('button'); b.innerHTML = icon(m.cat, 20);
    b.append(el('span', {}, m.name), el('small', {}, RG[m.region]?.name || ''));
    b.onclick = () => { hidden.delete(m.cat); saveHidden(); renderPins(); renderSide(); flyTo(m.x, m.y, Math.max(view.s, fitS*3)); setTimeout(() => openMarker(m), reduce ? 0 : 440); closeSide(); };
    li.append(b); ul.append(li);
  }
}
qEl.addEventListener('input', runSearch);
document.getElementById('showAll').onclick = () => { hidden.clear(); saveHidden(); renderPins(); renderSide(); };
document.getElementById('hideAll').onclick = () => { CATS.forEach(c => hidden.add(c.id)); saveHidden(); closePop(); renderPins(); renderSide(); };
const labelsOn = document.getElementById('labelsOn');
labelsOn.checked = store.get('emb.labels', true);
labelsEl.hidden = !labelsOn.checked;
labelsOn.onchange = () => { labelsEl.hidden = !labelsOn.checked; store.set('emb.labels', labelsOn.checked); };

/* 모바일 사이드바 */
const side = document.getElementById('side'), sideToggle = document.getElementById('sideToggle');
let scrim = null;
function openSide(){ side.classList.add('open'); sideToggle.setAttribute('aria-expanded', 'true');
  scrim = el('div', { className:'scrim' }); scrim.onclick = closeSide; document.body.append(scrim); }
function closeSide(){ side.classList.remove('open'); sideToggle.setAttribute('aria-expanded', 'false'); scrim?.remove(); scrim = null; }
sideToggle.onclick = openSide;

/* ───────── 마커 추가 모드 ───────── */
const addBtn = document.getElementById('addBtn'), hint = document.getElementById('hint');
let adding = false;
function setAdd(on){ adding = on; addBtn.setAttribute('aria-pressed', String(on)); mapEl.classList.toggle('adding', on); hint.hidden = !on; }
addBtn.onclick = () => { closePop(); setAdd(!adding); };
document.getElementById('addSide').onclick = () => { closePop(); closeSide(); setAdd(true); };
addEventListener('keydown', e => { if (e.key === 'Escape'){ setAdd(false); closePop(); closeSide(); } });

/* ───────── 입력 (드래그·휠·핀치) ───────── */
const pts = new Map(); let moved = 0, pinch = null;
mapEl.addEventListener('pointerdown', e => {
  if (e.target.closest('.pin,.pop,.ctrl,.side-toggle')) return;
  mapEl.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pts.size === 1) moved = 0;
  if (pts.size === 2){ const [a, b] = [...pts.values()]; pinch = Math.hypot(a.x-b.x, a.y-b.y); }
  mapEl.classList.add('dragging');
});
mapEl.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  const p = pts.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pts.size === 1){ view.tx += dx; view.ty += dy; moved += Math.abs(dx) + Math.abs(dy); apply(); }
  else if (pts.size === 2){
    const [a, b] = [...pts.values()], d = Math.hypot(a.x-b.x, a.y-b.y), r = mapEl.getBoundingClientRect();
    if (pinch) zoomAt(d / pinch, (a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top);
    pinch = d; moved += 99;
  }
});
function up(e){
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
  if (pts.size === 0){
    mapEl.classList.remove('dragging');
    if (moved < 6){
      const r = mapEl.getBoundingClientRect(), [wx, wy] = toWorld(e.clientX - r.left, e.clientY - r.top);
      if (adding && wx >= 0 && wy >= 0 && wx <= 1000 && wy <= 1000) openAddForm(wx, wy);
      else closePop();
    }
  }
}
mapEl.addEventListener('pointerup', up); mapEl.addEventListener('pointercancel', up);
mapEl.addEventListener('wheel', e => {
  if (e.target.closest('.pop')) return;
  e.preventDefault(); const r = mapEl.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY * .0015), e.clientX - r.left, e.clientY - r.top);
}, { passive:false });
const center = () => { const r = mapEl.getBoundingClientRect(); return [r.width/2, r.height/2]; };
document.getElementById('zin').onclick  = () => zoomAt(1.4, ...center());
document.getElementById('zout').onclick = () => zoomAt(1/1.4, ...center());
document.getElementById('zfit').onclick = () => { const s = view; fit(); const t = view; view = s; flyTo(500, 500, t.s); };
let lastW = 0;
new ResizeObserver(() => { const w = mapEl.clientWidth; if (!lastW){ fit(); } lastW = w; apply(); }).observe(mapEl);

/* ───────── 시작 ───────── */
renderLabels(); renderRegions(); renderSide(); fit(); renderPins();
requestAnimationFrame(() => setTimeout(drawTerrain, 20));
})();
</script>
</body>
